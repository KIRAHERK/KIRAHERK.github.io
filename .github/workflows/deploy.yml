name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Collect static output
        run: |
          if [ -d dist/client ]; then PUBLIC_DIR=dist/client;
          elif [ -d .output/public ]; then PUBLIC_DIR=.output/public;
          else echo "No static output found"; exit 1; fi
          echo "Publishing $PUBLIC_DIR"
          rm -rf _site
          cp -r "$PUBLIC_DIR" _site
          touch _site/.nojekyll
          # SPA-style fallback so deep links don't 404 on GitHub Pages
          if [ ! -f _site/404.html ] && [ -f _site/index.html ]; then
            cp _site/index.html _site/404.html
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

